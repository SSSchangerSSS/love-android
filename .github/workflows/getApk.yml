name: android

on:
  workflow_dispatch:
    inputs:
      romURL:
        description: '(اختیاری) لینک مستقیم game.love — اگر خالی باشد از پوشه main/ ساخته می‌شود'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Package game from main/ folder into game.love
        if: ${{ github.event.inputs.romURL == '' }}
        run: |
          mkdir -p app/src/main/assets/
          cd main
          zip -r -X ../app/src/main/assets/game.love .
          cd ..
          echo "=== game.love contents (root files) ==="
          unzip -l app/src/main/assets/game.love | head -15
          echo "..."
          ls -la app/src/main/assets/

      - name: Fetch game.love from direct URL (fallback mode)
        if: ${{ github.event.inputs.romURL != '' }}
        run: |
          mkdir -p app/src/main/assets/
          curl -L# "${{ github.event.inputs.romURL }}" -o app/src/main/assets/game.love

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleNormal --no-daemon --stacktrace

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%dT%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-hero-apk-${{ steps.date.outputs.date }}
          path: app/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadowhero-${{ steps.date.outputs.date }}
          name: ShadowHero ${{ steps.date.outputs.date }}
          files: app/build/outputs/apk/normal/release/*.apk
